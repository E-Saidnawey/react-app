# Force detection as node + SPA
[phases.setup]
nixPkgs = ["nodejs_22", "npm-10_x"]

# Install dependencies
[phases.install]
cmds = ["npm ci"]

# Build Vite app
[phases.build]
cmds = ["npm run build"]

# The output directory
[variables]
NIXPACKS_SPA_OUTPUT_DIR = "dist"

# Caddy server config for Coolify
[staticAssets]
"Caddyfile" = """
{
  admin off
  log {
    level INFO
  }
}

:3000 {
  root * /app/dist
  encode gzip zstd
  file_server
  try_files {path} /index.html
}
"""