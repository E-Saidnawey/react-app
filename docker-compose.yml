version: '3.8'

services:
  portfolio:
    build: .
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://api.yourdomain.com}
      - VITE_DB_URL=${VITE_DB_URL}
      - VITE_PLANT_MONITOR_ENABLED=${VITE_PLANT_MONITOR_ENABLED:-true}
      - VITE_MQTT_BROKER_URL=${VITE_MQTT_BROKER_URL}
    restart: unless-stopped
    networks:
      - portfolio-network

  # Optional: PostgreSQL database for plant monitoring
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-portfolio_db}
      - POSTGRES_USER=${POSTGRES_USER:-portfolio_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - portfolio-network

volumes:
  postgres_data:

networks:
  portfolio-network:
    driver: bridge

